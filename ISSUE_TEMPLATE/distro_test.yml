name: "🧪 Rapport de test Distribution / Noyau"
description: "Rapporter un résultat de compilation cmake ou d'exécution"
title: "[Test Distro] <RAPTOR VER 2.0>"
labels: ["testing", "kernel"]
body:
  - type: input
    id: os_info
    attributes:
      label: Distribution et Architecture
      placeholder: "ex. Debian 13 x86_64"
    validations:
      required: true
  - type: dropdown
    id: compiler
    attributes:
      label: Compilateur
      options:
        - GCC
        - Clang
  - type: checkboxes
    id: features
    attributes:
      label: Outils testés
      options:
        - label: "rap hunt"
        - label: "rap netop"
        - label: "rap sentry"
