name: "🧪 Rapport de test Distribution / Noyau"
description: "Rapporter un résultat de compilation cmake ou d'exécution sur votre système"
title: "[Test Distro] <RAPTOR VER 2.0>"
labels: ["kernel", "testing"]
body:
  - type: markdown
    attributes:
      value: |
        ### Matrice de Compatibilité RAPTOR DEFENSE
        Merci de participer aux tests de validation. Ce formulaire permet de documenter la stabilité des appels système et du binaire C99 sur différentes configurations.

  - type: input
    id: os_info
    attributes:
      label: Distribution et Architecture
      description: "Système d'exploitation et architecture matérielle."
      placeholder: "ex. Debian 13 (Trixie) x86_64, AlmaLinux 9 aarch64, Alpine Linux x86_64"
    validations:
      required: true

  - type: input
    id: kernel_ver
    attributes:
      label: Version du noyau Linux
      description: "Sortie exacte de la commande : uname -r"
      placeholder: "ex. 6.8.0-45-generic"
    validations:
      required: true

  - type: dropdown
    id: env_type
    attributes:
      label: Type d'environnement
      description: "Dans quel contexte s'exécute le système ?"
      options:
        - "Machine physique dédiée (Bare-Metal)"
        - "Machine Virtuelle (KVM / QEMU / Proxmox)"
        - "Machine Virtuelle (VirtualBox / VMware)"
        - "WSL2 (Windows Subsystem for Linux)"
        - "Conteneur (Docker / Podman / LXC)"
    validations:
      required: true

  - type: dropdown
    id: compiler_libc
    attributes:
      label: Compilateur & Bibliothèque C
      options:
        - "GCC + glibc (standard)"
        - "Clang / LLVM + glibc"
        - "GCC + musl libc (Alpine, etc.)"
        - "Clang + musl libc"
        - "Autre"
    validations:
      required: true

  - type: checkboxes
    id: cli_tested
    attributes:
      label: Modules CLI 0-Heap testés avec succès
      description: "Cochez les utilitaires exécutés sans anomalie :"
      options:
        - label: "rap hunt (Audit universel combiné)"
        - label: "rap rx (Traque des segments Inode 0)"
        - label: "rap netop / rap no (Console tactique des sockets /proc/net/tcp)"
        - label: "rap sentry (Surveillance synchrone fanotify)"
        - label: "rapless (Téléscripteur 0-heap)"

  - type: checkboxes
    id: extra_tested
    attributes:
      label: Composants avancés testés
      options:
        - label: "Station Graphique Raylib (./raptor)"
        - label: "Banc d'essai mprotect (tools/test_stealth)"
        - label: "Banc d'essai injection LD_PRELOAD (tools/test_preload)"

  - type: dropdown
    id: overall_status
    attributes:
      label: Résultat global du test
      options:
        - "Succès total (Compilation propre 0 avertissement, exécution nominale)"
        - "Succès avec avertissements du compilateur (Warnings)"
        - "Échec partiel (Certains modules refusent de démarrer)"
        - "Échec total de compilation"
    validations:
      required: true

  - type: textarea
    id: build_logs
    attributes:
      label: Journal de compilation ou alertes terminal
      description: "Collez ici les sorties de commande 'cmake' ou les erreurs d'exécution éventuelles."
      placeholder: "Collez vos logs ici..."
      render: shell

  - type: textarea
    id: notes
    attributes:
      label: Remarques & Comportement mémoire
      description: "Observations sur la réactivité, l'affichage console ou l'immunité mémoire."
      placeholder: "Exécution fluide sur TTY natif, aucune surcharge processeur..."
